apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
    scrape_configs:
      - job_name: 'microservices'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets:
              - 'eureka-server:8761'
              - 'party-service:8081'
              - 'player-service:8082'
              - 'stats-service:8083'