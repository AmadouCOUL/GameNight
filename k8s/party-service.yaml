apiVersion: apps/v1
kind: Deployment
metadata:
  name: party-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: party-service
  template:
    metadata:
      labels:
        app: party-service
    spec:
      containers:
        - name: party-service
          image: party-service:latest
          imagePullPolicy: IfNotPresent # Changé de Never à IfNotPresent
          ports:
            - containerPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: party-service
spec:
  selector:
    app: party-service
  ports:
    - protocol: TCP
      port: 8081
      targetPort: 8081
      nodePort: 30081 # Ajouté pour tes tests Postman
  type: NodePort