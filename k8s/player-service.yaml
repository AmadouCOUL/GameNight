apiVersion: apps/v1
kind: Deployment
metadata:
  name: player-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: player-service
  template:
    metadata:
      labels:
        app: player-service
    spec:
      containers:
        - name: player-service
          image: player-service:latest
          imagePullPolicy: IfNotPresent # Pour éviter l'erreur de pull
          ports:
            - containerPort: 8082
---
apiVersion: v1
kind: Service
metadata:
  name: player-service
spec:
  selector:
    app: player-service
  ports:
    - protocol: TCP
      port: 8082
      targetPort: 8082
      nodePort: 30082 # Port pour ajouter des joueurs via Postman
  type: NodePort