server:
  port: 8081

spring:
  application:
    name: party-service

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
        prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: always